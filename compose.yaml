# Local development stack: SQL Server + the API + the Angular app.
#   docker compose up --build        start everything (web at http://localhost:4200, API at http://localhost:5147/swagger)
#   docker compose down              stop (data is kept in the sqlserver-data volume)
#   docker compose down -v           stop and delete the database
#
# The SQL Server password comes from the .env file next to this one.

name: pulsewallet

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer   # free edition for development and testing
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"          # also reachable from your machine (Rider, SSMS, Azure Data Studio) on localhost,1433
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Healthy once SQL Server accepts logins, not just when the container has started.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-off job: creates the PulseWallet database if it doesn't exist yet, then exits.
  # Once you add EF Core migrations, they'll create the tables inside it.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD}
      - -b
      - -Q
      - IF DB_ID('PulseWallet') IS NULL CREATE DATABASE PulseWallet;
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/PulseWallet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides ConnectionStrings:PulseWallet. "sqlserver" is the service name above, resolved by Docker's network.
      # TrustServerCertificate is needed because the dev SQL Server uses a self-signed certificate.
      ConnectionStrings__PulseWallet: "Server=sqlserver,1433;Database=PulseWallet;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      # Where traces, metrics and logs go (OTLP over gRPC). "aspire-dashboard" is the service name below.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      # The only proxy whose X-Forwarded-For the API believes: the web container's fixed address below.
      ForwardedHeaders__KnownProxies__0: "172.28.5.10"
    ports:
      - "5147:8080"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully

  # Shows traces, metrics and structured logs sent over OTLP. Keeps data in memory only: a restart clears it.
  # Any OTLP backend could take its place (Jaeger, Elastic, Azure Monitor) without a code change in the API.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.0
    environment:
      # No login for a local, single-user tool. Never expose it like this outside your machine.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # UI at http://localhost:18888
      - "4317:18889"    # OTLP gRPC, for the API when it runs from the IDE (see launchSettings.json)

  web:
    build:
      context: web
    ports:
      - "4200:8080"
    depends_on:
      - api   # nginx resolves the "api" host name at startup and exits if it doesn't exist yet
    networks:
      default:
        # Fixed, so the API can trust X-Forwarded-For from exactly this address (ForwardedHeaders__KnownProxies__0).
        ipv4_address: 172.28.5.10

volumes:
  sqlserver-data:

networks:
  default:
    # An explicit subnet, needed for the fixed address above. Docker's gateway (172.28.5.1) is what requests to
    # the published ports appear to come from, which is why only nginx's single address is trusted, not the subnet.
    ipam:
      config:
        - subnet: 172.28.5.0/24
