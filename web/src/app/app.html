<header
  class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80"
>
  <div class="mx-auto flex max-w-2xl items-center justify-between gap-4 px-4 py-3">
    <a
      routerLink="/"
      class="flex items-center gap-2 rounded-lg focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
    >
      <span
        aria-hidden="true"
        class="grid size-8 place-items-center rounded-lg bg-linear-to-br from-indigo-500 to-violet-600 text-sm font-bold text-white shadow-sm"
      >
        P
      </span>
      <span class="hidden text-lg font-semibold tracking-tight sm:inline">PulseWallet</span>
    </a>

    <div class="flex items-center gap-1">
      <nav aria-label="Main" class="flex items-center gap-1 text-sm font-medium">
        <!--
          routerLinkActive adds the given classes while the link's route is the current one.
          [routerLinkActiveOptions]="exactPath" stops "/" from matching every page (see app.ts).
          ariaCurrentWhenActive="page" sets aria-current, so screen readers announce "current page".
        -->
        <a
          routerLink="/"
          routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
          [routerLinkActiveOptions]="exactPath"
          ariaCurrentWhenActive="page"
          class="rounded-lg px-3 py-2 text-slate-600 transition hover:text-slate-900 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none dark:text-slate-400 dark:hover:text-white"
        >
          Look up
        </a>
        <a
          routerLink="/wallets/new"
          routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
          ariaCurrentWhenActive="page"
          class="rounded-lg px-3 py-2 text-slate-600 transition hover:text-slate-900 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none dark:text-slate-400 dark:hover:text-white"
        >
          New wallet
        </a>
      </nav>
      <app-theme-toggle />
    </div>
  </div>
</header>

<main class="mx-auto max-w-2xl px-4 py-10">
  <router-outlet />
</main>
