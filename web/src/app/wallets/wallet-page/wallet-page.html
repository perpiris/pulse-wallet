<section class="space-y-6">
  <a
    routerLink="/wallets"
    class="inline-flex items-center gap-1 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none dark:text-slate-400 dark:hover:text-white"
  >
    <span aria-hidden="true">←</span> My wallets
  </a>

  <!-- aria-live: screen readers announce whatever appears in here (loading, error, the wallet). -->
  <div aria-live="polite">
    @if (wallet.isLoading()) {
      <!-- A skeleton: grey blocks in the card's shape, so the page doesn't jump when the data arrives. -->
      <div
        class="animate-pulse rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"
      >
        <span class="sr-only">Loading wallet…</span>
        <div class="h-36 rounded-xl bg-slate-200 dark:bg-slate-800"></div>
        <div class="mt-6 space-y-3">
          <div class="h-10 rounded-lg bg-slate-100 dark:bg-slate-800/60"></div>
          <div class="h-10 rounded-lg bg-slate-100 dark:bg-slate-800/60"></div>
        </div>
      </div>
    } @else if (error(); as error) {
      <!-- `as error` stores the result of error() in a local variable for this block, so it's called once. -->
      <div
        role="alert"
        class="flex gap-3 rounded-2xl border border-red-200 bg-red-50 p-4 text-red-800 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-300"
      >
        <svg
          aria-hidden="true"
          class="mt-0.5 size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v4M12 16h.01" />
        </svg>
        <div>
          <p class="font-semibold">{{ error.title }}</p>
          <p class="text-sm">{{ error.detail }}</p>
        </div>
      </div>
    } @else if (wallet.hasValue()) {
      <!-- [wallet]="..." passes a value into the child's input() of the same name. -->
      <app-wallet-card [wallet]="wallet.value()" />
      <!-- The actions live here, not in the card: the card only displays, this page decides what you can do. -->
      <div class="mt-4 grid grid-cols-3 gap-3">
        <button
          type="button"
          (click)="openSendDialog()"
          [disabled]="preparingSend()"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus-visible:ring-4 focus-visible:ring-indigo-500/30 focus-visible:outline-none disabled:opacity-60"
        >
          <span aria-hidden="true">→</span> Send
        </button>
        <button
          type="button"
          (click)="openMoneyDialog('top-up')"
          class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-semibold shadow-sm transition hover:bg-slate-50 focus-visible:ring-4 focus-visible:ring-indigo-500/30 focus-visible:outline-none dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800"
        >
          <span aria-hidden="true">+</span> Top up
        </button>
        <button
          type="button"
          (click)="openMoneyDialog('withdrawal')"
          class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-semibold shadow-sm transition hover:bg-slate-50 focus-visible:ring-4 focus-visible:ring-indigo-500/30 focus-visible:outline-none dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800"
        >
          <span aria-hidden="true">−</span> Withdraw
        </button>
      </div>
    }
  </div>
</section>
