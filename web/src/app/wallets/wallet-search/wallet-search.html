<section class="space-y-8">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">Look up a wallet</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-400">
      Paste a wallet ID to see its balance and latest transactions.
    </p>
  </div>

  <div>
    <!-- sr-only: hidden on screen but still read by screen readers, so the input keeps a proper label. -->
    <label for="wallet-id" class="sr-only">Wallet ID</label>
    <div class="relative">
      <svg
        aria-hidden="true"
        class="pointer-events-none absolute top-1/2 left-4 size-5 -translate-y-1/2 text-slate-400 dark:text-slate-500"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <!--
        #search is a template reference variable: a name for this <input> element, usable anywhere in this template.
        (input)="..." is an event binding: runs on every keystroke or paste.
        [attr.aria-invalid] is an attribute binding: `attr.` is needed because aria-* are HTML attributes, not DOM properties.
        Tailwind's `aria-invalid:` classes then style the input red, straight from that attribute.
        Signal Forms (@angular/forms/signals) are the modern way to build real forms; for one search box, a signal is enough.
      -->
      <input
        #search
        id="wallet-id"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Wallet ID, e.g. 3f2b8c1e-9a4d-4e6f-b1c2-7d8e9f0a1b2c"
        class="w-full rounded-xl border border-slate-300 bg-white py-3.5 pr-4 pl-12 font-mono text-sm shadow-sm transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 focus:outline-none aria-invalid:border-red-500 aria-invalid:focus:ring-red-500/20 dark:border-slate-700 dark:bg-slate-900 dark:placeholder:text-slate-500 dark:focus:border-indigo-400"
        [attr.aria-invalid]="invalidId()"
        aria-describedby="wallet-id-hint"
        [value]="query()"
        (input)="query.set(search.value)"
      />
    </div>
    <p id="wallet-id-hint" class="mt-2 min-h-5 text-sm text-red-600 dark:text-red-400">
      <!--
        @if is the built-in control flow (v17+). It replaces *ngIf and needs no import.
        Signals are read by calling them, also in templates: invalidId(), not invalidId.
      -->
      @if (invalidId()) {
        That doesn't look like a wallet ID.
      }
    </p>
  </div>

  <!-- aria-live: screen readers announce whatever appears in here (loading, error, the wallet). -->
  <div aria-live="polite">
    @if (wallet.isLoading()) {
      <!-- A skeleton: grey blocks in the card's shape, so the page doesn't jump when the data arrives. -->
      <div
        class="animate-pulse rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"
      >
        <span class="sr-only">Looking up wallet…</span>
        <div class="h-36 rounded-xl bg-slate-200 dark:bg-slate-800"></div>
        <div class="mt-6 space-y-3">
          <div class="h-10 rounded-lg bg-slate-100 dark:bg-slate-800/60"></div>
          <div class="h-10 rounded-lg bg-slate-100 dark:bg-slate-800/60"></div>
        </div>
      </div>
    } @else if (error(); as error) {
      <!-- `as error` stores the result of error() in a local variable for this block, so it's called once. -->
      <div
        role="alert"
        class="flex gap-3 rounded-2xl border border-red-200 bg-red-50 p-4 text-red-800 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-300"
      >
        <svg
          aria-hidden="true"
          class="mt-0.5 size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v4M12 16h.01" />
        </svg>
        <div>
          <p class="font-semibold">{{ error.title }}</p>
          <p class="text-sm">{{ error.detail }}</p>
        </div>
      </div>
    } @else if (wallet.hasValue()) {
      <!-- [wallet]="..." passes a value into the child's input() of the same name. -->
      <app-wallet-card [wallet]="wallet.value()" />
      <!-- The actions live here, not in the card: the card only displays, this page decides what you can do. -->
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button
          type="button"
          (click)="openMoneyDialog('top-up')"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus-visible:ring-4 focus-visible:ring-indigo-500/30 focus-visible:outline-none"
        >
          <span aria-hidden="true">+</span> Top up
        </button>
        <button
          type="button"
          (click)="openMoneyDialog('withdrawal')"
          class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-semibold shadow-sm transition hover:bg-slate-50 focus-visible:ring-4 focus-visible:ring-indigo-500/30 focus-visible:outline-none dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800"
        >
          <span aria-hidden="true">−</span> Withdraw
        </button>
      </div>
    }
  </div>
</section>
