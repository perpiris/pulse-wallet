<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PulseWallet</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      Runs before the page is drawn and before Angular has even downloaded, so a dark-theme user never sees
      a white flash. Angular can't do this itself: by the time it starts, the white page has already been shown.
      A saved choice wins; otherwise the OS setting decides. ThemeStore takes over from here.
    -->
    <script>
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem('pulsewallet-theme');
        } catch {}
        const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
