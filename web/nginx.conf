server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same origin for the browser, so the API needs no CORS. "api" is the compose service name.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular handles routing in the browser: a deep link like /wallets/123 has no file on disk,
    # so serve index.html and let the router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
